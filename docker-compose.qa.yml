services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iot_management
      POSTGRES_PASSWORD: iot_qa_password
      POSTGRES_USER: iot_qa
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_qa -d iot_management"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.2-alpine
    ports:
      - "127.0.0.1::6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
