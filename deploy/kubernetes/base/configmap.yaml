apiVersion: v1
kind: ConfigMap
metadata:
  name: iot-management-config
  labels:
    app.kubernetes.io/part-of: iot-management
data:
  API_PORT: "3001"
  NODE_ENV: production
  WEB_PORT: "3000"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: iot_management
  DATABASE_SCHEMA: public
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  WEB_BASE_URL: http://localhost:3000
