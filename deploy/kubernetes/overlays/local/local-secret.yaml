apiVersion: v1
kind: Secret
metadata:
  name: iot-management-secrets
  labels:
    app.kubernetes.io/part-of: iot-management
type: Opaque
stringData:
  DATABASE_URL: postgresql://iot_local:iot_local_password@postgres:5432/iot_management
  REDIS_URL: redis://redis:6379
  POSTGRES_USER: iot_local
  POSTGRES_PASSWORD: iot_local_password
  JWT_SESSION_SECRET: local-development-session-secret
