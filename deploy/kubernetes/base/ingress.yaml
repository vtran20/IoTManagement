apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iot-management
  labels:
    app.kubernetes.io/part-of: iot-management
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  rules:
    - host: iot-management.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
