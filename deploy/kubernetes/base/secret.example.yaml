apiVersion: v1
kind: Secret
metadata:
  name: iot-management-secrets
  labels:
    app.kubernetes.io/part-of: iot-management
type: Opaque
stringData:
  DATABASE_URL: postgresql://CHANGE_ME:CHANGE_ME@postgres:5432/iot_management
  REDIS_URL: redis://redis:6379
  POSTGRES_USER: CHANGE_ME
  POSTGRES_PASSWORD: CHANGE_ME
  JWT_SESSION_SECRET: replace-with-at-least-24-random-characters
